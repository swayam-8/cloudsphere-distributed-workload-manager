# Local MongoDB alternative to the automatic `npm run dev` launcher.
# This is development-only: loopback port, no DB authentication, one replica member.
services:
  mongo:
    image: mongo:7
    container_name: cloudsphere-mongo
    labels:
      com.cloudsphere.local: "true"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mongo-data:
    name: cloudsphere-mongo-data
